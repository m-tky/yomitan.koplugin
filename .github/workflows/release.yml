name: Build plugin release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test portable tooling
        run: python3 -m unittest discover -s tools/tests -v
      - name: Check Lua source syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
          find yomitan.koplugin -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            luajit -b "$file" /tmp/yomitan-source.luac
          done
      - name: Build reproducible plugin ZIP
        shell: bash
        run: |
          version=$(python3 tools/package-yomitan-plugin.py --source yomitan.koplugin --output dist/yomitan.koplugin.zip)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Publish explicitly pushed release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/yomitan.koplugin.zip dist/yomitan.koplugin.zip.sha256 --verify-tag --latest --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
